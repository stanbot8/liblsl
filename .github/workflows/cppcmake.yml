name: C/C++ CI

on:
  push:
    branches:
    - main
    - dev
    tags: ['*']
    paths:
    - '**'
    - '!docs/**'
    - '!.github/**'
    - .github/workflows/cppcmake.yml
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      cmakeextra:
        description: Extra CMake options
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ (github.event_name == 'workflow_dispatch' || 
    github.run_attempt > 1) && (true) }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config:
        # x86_64 Linux builds
        - {name: ubuntu-22.04-x64, os: ubuntu-22.04, arch: x86_64}
        - {name: ubuntu-24.04-x64, os: ubuntu-24.04, arch: x86_64}

        # ARM Linux builds - cross-compiled with QEMU testing (Jetson, Raspberry Pi compatible)
        # SHLIBDEPS must be disabled for cross-compiled packages as the host system
        # does not have the target architecture libraries installed
        - {name: ubuntu-22.04-arm64, os: ubuntu-22.04, arch: aarch64, 
            cross_compile: true, cmake_extra: -DLSL_DISABLE_PACKAGE_SHLIBDEPS=ON}
        - {name: ubuntu-22.04-armhf, os: ubuntu-22.04, arch: armv7, 
            cross_compile: true, cmake_extra: -DLSL_DISABLE_PACKAGE_SHLIBDEPS=ON}

        # Native ARM build
        # - {name: "ubuntu-24.04-arm64-native", os: "ubuntu-24.04-arm", arch: "aarch64" }

        # Windows builds
        - {name: windows-x64, os: windows-latest, arch: x86_64, cmake_extra: '-T v142,host=x86'}
        - {name: windows-x86, os: windows-latest, arch: x86, cmake_extra: '-T v142,host=x86
            -A Win32'}
        - {name: windows-arm64, os: windows-11-arm, arch: aarch64, cmake_extra: '-T
            v143,host=ARM64 -A ARM64'}

        # macOS non-framework builds (build-only, no tests or release uploads)
        # These verify compatibility with package managers like conda-forge
        - {name: macos-dylib-x64, os: macos-15-intel, arch: x86_64, cmake_extra: 
            -DLSL_FRAMEWORK=OFF, build_only: true}
        - {name: macos-dylib-arm64, os: macos-latest, arch: arm64, cmake_extra: 
            -DLSL_FRAMEWORK=OFF, build_only: true}

    steps:
    - uses: actions/checkout@v5
      with:
        # Need full history + tags so the version can be derived from the git tag
        fetch-depth: 0

    # Set up cross-compilation toolchain for ARM on Linux
        ref: ${{ (github.event_name == 'schedule' || github.event_name == 
          'workflow_run') && '42118f80ff9235be11cd54d24b3a25f576c34812' || 
          github.sha }}
    - name: Install cross-compilation toolchain
      if: matrix.config.cross_compile && runner.os == 'Linux'
      run: |
        sudo apt-get update
        if [[ "${{ matrix.config.arch }}" == "aarch64" ]]; then
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu
          echo "CMAKE_TOOLCHAIN=-DCMAKE_TOOLCHAIN_FILE=${GITHUB_WORKSPACE}/cmake/toolchains/aarch64-linux-gnu.cmake" >> $GITHUB_ENV
        elif [[ "${{ matrix.config.arch }}" == "armv7" ]]; then
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf
          echo "CMAKE_TOOLCHAIN=-DCMAKE_TOOLCHAIN_FILE=${GITHUB_WORKSPACE}/cmake/toolchains/arm-linux-gnueabihf.cmake" >> $GITHUB_ENV
        fi

    # Cache dependencies for Linux
    - name: Cache APT packages
      if: runner.os == 'Linux'
      uses: actions/cache@v4
      with:
        path: /var/cache/apt/archives
        key: ${{ runner.os }}-apt-${{ matrix.config.name }}-${{ 
          hashFiles('.github/workflows/cppcmake.yml') }}
        restore-keys: |
          ${{ runner.os }}-apt-${{ matrix.config.name }}-
          ${{ runner.os }}-apt-

    # Cache build artifacts with ccache
    - name: Cache ccache
      if: runner.os == 'Linux' || runner.os == 'macOS'
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-${{ matrix.config.name }}-${{ 
          ((github.event_name == 'schedule' || github.event_name == 
          'workflow_run') && '42118f80ff9235be11cd54d24b3a25f576c34812' || 
          github.sha) }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ matrix.config.name }}-
          ${{ runner.os }}-ccache-

    - name: Install ccache
      if: runner.os == 'Linux' || runner.os == 'macOS'
      run: |
        if [[ "${{ runner.os }}" == "Linux" ]]; then
          sudo apt-get install -y ccache
        elif [[ "${{ runner.os }}" == "macOS" ]]; then
          brew install ccache
        fi
        ccache --max-size=500M
        ccache --set-config=compression=true

    - name: Configure CMake
      run: |
        # Set up ccache as compiler wrapper (skip for cross-compilation)
        if [[ "${{ runner.os }}" == "Linux" || "${{ runner.os }}" == "macOS" ]] && [[ "${{ matrix.config.cross_compile }}" != "true" ]]; then
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          export CC="ccache gcc"
          export CXX="ccache g++"
        fi

        cmake --version
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=${PWD}/install \
          -DLSL_UNITTESTS=ON \
          -DLSL_BENCHMARKS=ON \
          -DCPACK_PACKAGE_DIRECTORY=${PWD}/package \
          -DCPACK_PACKAGE_FILE_NAME="liblsl-${{ matrix.config.arch }}" \
          -Dlslgitrevision=${{ ((github.event_name == 'schedule' || github.event_name == 'workflow_run') && '42118f80ff9235be11cd54d24b3a25f576c34812' || github.sha) }} \
          -Dlslgitbranch=${{ ((github.event_name == 'schedule' || github.event_name == 'workflow_run') && 'refs/heads/dev' || github.ref) }} \
          ${CMAKE_TOOLCHAIN} \
          ${{ matrix.config.cmake_extra }} \
          ${{ github.event.inputs.cmakeextra }}
        echo "Build directory: ${PWD}"

    - name: Build
      run: |
        cmake --build build --config Release -j
        # Show ccache statistics
        if command -v ccache &> /dev/null; then
          ccache -s
        fi

    - name: Install
      run: |-
        cmake --build build --config Release --target install


    - name: Test install using examples
      run: |
        # Test that the in-tree install was successful by building the examples
        cmake -S examples -B examples/build \
          -DLSL_INSTALL_ROOT=${PWD}/install \
          -DCMAKE_INSTALL_PREFIX=examples/build/install \
          -DLSL_COMFY_DEFAULTS=ON \
          ${CMAKE_TOOLCHAIN} \
          ${{ matrix.config.cmake_extra }} \
          ${{ github.event.inputs.cmakeextra }}
        cmake --build examples/build --target install --config Release -j

        # Run example binary (skip for cross-compiled builds - no QEMU)
        if [[ "${{ matrix.config.cross_compile }}" != "true" ]]; then
          ./examples/build/install/bin/HandleMetaData
        else
          echo "Skipping example execution for cross-compiled build (requires real ARM hardware)"
          echo "Build validation successful - binary can be tested on target hardware"
        fi

    - name: Package
      if: matrix.config.build_only != true
      run: |
        echo "Creating package for ${{ matrix.config.arch }}"
        cmake --build build --target package --config Release -j

        # On Debian / Ubuntu the dependencies can only be resolved for
        # already installed packages (only for native builds, not cross-compiled)
        if [[ "${{ matrix.config.os }}" == ubuntu-* ]] && [[ "${{ matrix.config.cross_compile }}" != "true" ]]; then
          cmake -DCPACK_DEBIAN_PACKAGE_SHLIBDEPS=ON build
          sudo dpkg -i package/*.deb
          cmake --build build --target package --config Release -j
          dpkg -I package/liblsl*.deb
        fi

        if [[ "${{ matrix.config.cross_compile }}" == "true" ]]; then
          echo "Cross-compiled ${{ matrix.config.arch }} package created"
          ls -lh package/
        fi

        cmake -E remove_directory package/_CPack_Packages
        cp testing/lslcfgs/default.cfg . 2>/dev/null || true

    - name: upload install dir
      if: matrix.config.build_only != true
      uses: actions/upload-artifact@master
      with:
        name: build-${{ matrix.config.name }}
        path: install

    - name: upload package
      if: matrix.config.build_only != true
      uses: actions/upload-artifact@master
      with:
        name: pkg-${{ matrix.config.name }}
        path: package

    - name: print network config
      run: |
        which ifconfig && ifconfig
        if [ `which ip` ]; then
           ip link
           ip addr
           ip route
           ip -6 route
        fi

    # Run tests (native builds only, skip build_only configs)
    - name: Unit tests
      if: matrix.config.cross_compile != true && matrix.config.build_only != 
        true
      run: |
        # Set up core dumps for debugging
        if [[ "${{ matrix.config.name }}" == ubuntu-* ]]; then
          ulimit -c unlimited
          echo "$PWD/dumps/corefile-%e-%p-%t" | sudo tee /proc/sys/kernel/core_pattern
        fi
        mkdir -p dumps

        # Run unit tests
        install/bin/lsl_test_internal --order rand --wait-for-keypress never --durations yes
        install/bin/lsl_test_exported --order rand --wait-for-keypress never --durations yes
      timeout-minutes: 10

    - name: upload dump
      if: failure()
      uses: actions/upload-artifact@master
      with:
        name: dumps-${{ matrix.config.name }}
        path: dumps

    - name: Upload to release
      if: github.event_name == 'release' && matrix.config.build_only != true
      uses: softprops/action-gh-release@v2
      with:
        files: package/*.*
    needs:
    - alpha_bridge_inputs
    if: ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' 
      }}
  alpha_bridge_inputs:
    name: CI input check
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    concurrency:
      group: alpha-bridge-inputs-${{ github.workflow }}-${{ github.sha }}-${{ 
        github.event.schedule || github.event_name }}
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.identity.outputs.changed }}
    steps:
    - id: identity
      name: Check source, workflow, variables, and runner inputs
      env:
        GH_TOKEN: ${{ github.token }}
        AB_REPOSITORY: ${{ github.repository }}
        AB_RUN_ID: ${{ github.run_id }}
        AB_HEAD_SHA: ${{ (github.event_name == 'schedule' || github.event_name 
          == 'workflow_run') && '42118f80ff9235be11cd54d24b3a25f576c34812' || 
          github.sha }}
        AB_REF: ${{ (github.event_name == 'schedule' || github.event_name == 
          'workflow_run') && 'refs/heads/dev' || github.ref }}
        AB_WORKFLOW_DIGEST: 
          67355faf4a91fca49add4b3353995f2377b90e3097514f44966fc725116e360f
        AB_EVENT: ${{ github.event_name }}
        AB_SCHEDULE: ${{ github.event.schedule || '' }}
        AB_VARIABLES: ${{ toJSON(vars) }}
        AB_INPUTS: ${{ toJSON(inputs) }}
        AB_WORKFLOW_RUN: ${{ toJSON(github.event.workflow_run) }}
      shell: bash
      run: "python3 - <<'ALPHA_BRIDGE_CI_PY'\n\"\"\"Native automatic-CI input check,
        embedded in the owned fork configuration.\"\"\"\n\nfrom __future__ import
        annotations\n\nimport base64\nimport hashlib\nimport json\nimport os\nimport
        re\nimport urllib.parse\nimport urllib.request\n\nINPUT_CHECK_NAMES = (\"\
        CI input check\", \"AlphaBridge input check\")\nINPUT_IDENTITY_PREFIXES =
        (\"CI input identity \", \"AlphaBridge input identity \")\n\n\ndef input_identity(job):\n\
        \    for step in job.get(\"steps\", []):\n        if step.get(\"conclusion\"\
        ) != \"success\":\n            continue\n        name = step.get(\"name\"\
        , \"\")\n        for prefix in INPUT_IDENTITY_PREFIXES:\n            if name.startswith(prefix):\n\
        \                identity = name.removeprefix(prefix)\n                if
        re.fullmatch(r\"[0-9a-f]{64}\", identity):\n                    return identity\n\
        \    return \"\"\n\n\ndef parent_has_work(get, repository, parent):\n    if
        (\n        not parent\n        or parent.get(\"head_branch\") != \"alpha-bridge-ci\"\
        \n        or parent.get(\"status\") != \"completed\"\n    ):\n        return
        True\n    sha = parent[\"head_sha\"]\n    if re.fullmatch(r\"[0-9a-f]{40}\"\
        , sha) is None:\n        raise ValueError(\"parent workflow has no exact configuration
        commit\")\n    record = get(f\"/repos/{repository}\")\n    marker_file = get(f\"\
        /repos/{repository}/contents/.github/alpha-bridge-ci.json?ref={sha}\")\n \
        \   marker = json.loads(base64.b64decode(marker_file[\"content\"]))\n    if
        (\n        record.get(\"fork\") is not True\n        or marker.get(\"schema\"\
        ) != \"alpha-bridge/fork-ci\"\n        or marker.get(\"source_repository\"\
        ) != record.get(\"parent\", {}).get(\"full_name\")\n    ):\n        raise
        ValueError(\"parent CI configuration has no verified fork ownership\")\n \
        \   path = parent[\"path\"].split(\"@\", 1)[0]\n    if not path.startswith(\"\
        .github/workflows/\") or \"/\" in path.removeprefix(\".github/workflows/\"\
        ):\n        raise ValueError(\"parent workflow path is outside its configuration
        owner\")\n    definition = get(f\"/repos/{repository}/contents/{urllib.parse.quote(path,
        safe='/')}?ref={sha}\")\n    if hashlib.sha256(base64.b64decode(definition[\"\
        content\"])).hexdigest() != marker.get(\n        \"definition_sha256\", {}\n\
        \    ).get(path):\n        raise ValueError(\"parent workflow differs from
        its owned definition\")\n    if path == \".github/workflows/alpha-bridge-ci-verify.yml\"\
        :\n        return False\n    jobs = []\n    page = 1\n    while True:\n  \
        \      values = get(\n            f\"/repos/{repository}/actions/runs/{parent['id']}/jobs?per_page=100&page={page}\"\
        \n        )[\"jobs\"]\n        jobs.extend(values)\n        if len(values)
        < 100:\n            break\n        page += 1\n    guards = [\n        job\n\
        \        for job in jobs\n        if job.get(\"name\") in INPUT_CHECK_NAMES\n\
        \        and job.get(\"conclusion\") == \"success\"\n        and input_identity(job)\n\
        \    ]\n    return not guards or any(\n        job not in guards and job.get(\"\
        conclusion\") != \"skipped\" for job in jobs\n    )\n\n\ndef changed(get,
        *, repository, run_id, identity, job_name):\n    current = get(f\"/repos/{repository}/actions/runs/{run_id}\"\
        )\n    event = current[\"event\"]\n    page = 1\n    while True:\n       \
        \ # Filter locally: GitHub caps filtered searches at 1,000 results.\n    \
        \    query = urllib.parse.urlencode({\"per_page\": 100, \"page\": page})\n\
        \        runs = get(f\"/repos/{repository}/actions/workflows/{current['workflow_id']}/runs?{query}\"\
        )\n        for run in runs[\"workflow_runs\"]:\n            if run[\"id\"\
        ] == run_id:\n                continue\n            if run.get(\"head_branch\"\
        ) != current[\"head_branch\"] or run.get(\"event\") != event:\n          \
        \      continue\n            job_page = 1\n            while True:\n     \
        \           jobs = get(\n                    f\"/repos/{repository}/actions/runs/{run['id']}/jobs?per_page=100&page={job_page}\"\
        \n                )[\"jobs\"]\n                for job in jobs:\n        \
        \            if (\n                        (\n                           \
        \ job[\"name\"] in INPUT_CHECK_NAMES\n                            if job_name
        in INPUT_CHECK_NAMES\n                            else job[\"name\"] == job_name\n\
        \                        )\n                        and job.get(\"status\"\
        ) == \"completed\"\n                        and job.get(\"conclusion\") ==
        \"success\"\n                        and input_identity(job) == identity\n\
        \                    ):\n                        return False\n          \
        \      if len(jobs) < 100:\n                    break\n                job_page
        += 1\n        if len(runs[\"workflow_runs\"]) < 100:\n            return True\n\
        \        page += 1\n\n\ndef main():\n    event = os.environ[\"AB_EVENT\"]\n\
        \    event_payload = None\n    if event not in {\"schedule\", \"workflow_run\"\
        }:\n        with open(os.environ[\"GITHUB_EVENT_PATH\"], encoding=\"utf-8\"\
        ) as payload_file:\n            event_payload = json.load(payload_file)\n\
        \    inputs = {\n        \"source_commit\": os.environ[\"AB_HEAD_SHA\"],\n\
        \        \"source_ref\": os.environ[\"AB_REF\"],\n        \"workflow_definition\"\
        : os.environ[\"AB_WORKFLOW_DIGEST\"],\n        \"event\": event,\n       \
        \ \"event_payload\": event_payload,\n        \"schedule\": os.environ[\"AB_SCHEDULE\"\
        ],\n        \"variables\": json.loads(os.environ[\"AB_VARIABLES\"]),\n   \
        \     \"inputs\": json.loads(os.environ[\"AB_INPUTS\"]),\n        \"runner_image\"\
        : [os.environ.get(\"ImageOS\", \"\"), os.environ.get(\"ImageVersion\", \"\"\
        )],\n        \"producer\": json.loads(os.environ.get(\"AB_WORKFLOW_RUN\",
        \"null\")),\n    }\n    identity = hashlib.sha256(json.dumps(inputs, sort_keys=True).encode()).hexdigest()\n\
        \n    def get(path):\n        request = urllib.request.Request(\n        \
        \    \"https://api.github.com\" + path,\n            headers={\n         \
        \       \"Authorization\": \"Bearer \" + os.environ[\"GH_TOKEN\"],\n     \
        \           \"Accept\": \"application/vnd.github+json\",\n               \
        \ \"X-GitHub-Api-Version\": \"2026-03-10\",\n            },\n        )\n \
        \       with urllib.request.urlopen(request, timeout=60) as response:\n  \
        \          return json.load(response)\n\n    manual = event == \"workflow_dispatch\"\
        \ or int(os.environ[\"GITHUB_RUN_ATTEMPT\"]) > 1\n    should_run = manual
        or (\n        (\n            inputs[\"event\"] != \"workflow_run\"\n     \
        \       or parent_has_work(get, os.environ[\"AB_REPOSITORY\"], inputs[\"producer\"\
        ])\n        )\n        and changed(\n            get,\n            repository=os.environ[\"\
        AB_REPOSITORY\"],\n            run_id=int(os.environ[\"AB_RUN_ID\"]),\n  \
        \          identity=identity,\n            job_name=\"CI input check\",\n\
        \        )\n    )\n    with open(os.environ[\"GITHUB_OUTPUT\"], \"a\", encoding=\"\
        utf-8\") as output:\n        output.write(f\"digest={identity}\\nchanged={str(should_run).lower()}\\\
        n\")\n    print(\n        \"Explicit CI run requested\"\n        if manual\n\
        \        else \"CI inputs changed\"\n        if should_run\n        else \"\
        CI inputs unchanged; build and test jobs skipped\"\n    )\n\n\nif __name__
        == \"__main__\":\n    main()\n\nALPHA_BRIDGE_CI_PY\n"
    - name: CI input identity ${{ steps.identity.outputs.digest }}
      run: echo 'Input identity recorded'
